apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  labels:
    app: fastapi
    project: k8s-03
spec:
  type: NodePort  # External access via Node IP and port
  selector:
    app: fastapi  # Routes to Pods with this label
  ports:
  - port: 8000           # Service port
    targetPort: 8000     # Pod port
    nodePort: 30080      # Node port (30000-32767 range)
    protocol: TCP
    name: http

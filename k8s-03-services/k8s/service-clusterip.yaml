apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  labels:
    app: fastapi
    project: k8s-03
spec:
  type: ClusterIP  # Internal cluster access only
  selector:
    app: fastapi   # Routes to Pods with this label
  ports:
  - port: 8000           # Service port
    targetPort: 8000     # Pod port
    protocol: TCP
    name: http

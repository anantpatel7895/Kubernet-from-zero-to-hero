# Secret for files
# Secrets can store entire files (certificates, keys, etc.)

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets-files
  namespace: default
  labels:
    app: config-demo
type: Opaque
data:
  # These will be mounted as files in /etc/secrets/
  
  # api-key file content = "sk-prod-9876543210fedcba"
  api-key: c2stcHJvZC05ODc2NTQzMjEwZmVkY2Jh
  
  # db-password file content = "production-db-password-456"
  db-password: cHJvZHVjdGlvbi1kYi1wYXNzd29yZC00NTY=

---
# Example: TLS Secret for HTTPS
# Kubernetes has a special type for TLS certificates
apiVersion: v1
kind: Secret
metadata:
  name: tls-secret-example
  namespace: default
  labels:
    app: config-demo
type: kubernetes.io/tls
stringData:
  # In production, you'd get these from cert-manager or your CA
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    MIICljCCAX4CCQCKz9mC3V8zAzANBgkqhkiG9w0BAQsFADANMQswCQYDVQQGEwJV
    UzAeFw0yMzAxMDEwMDAwMDBaFw0yNDAxMDEwMDAwMDBaMA0xCzAJBgNVBAYTAlVT
    ... (This is a demo certificate, not valid)
    -----END CERTIFICATE-----
  
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    MIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC7VJTUt9Us8cKj
    MzEfYyjiWA4R4/M2bS1+fWIcPm15A8+raUH9qSGHR8+lkv7L5VLxqfbGfGQ8I0Nk
    ... (This is a demo key, not valid)
    -----END PRIVATE KEY-----

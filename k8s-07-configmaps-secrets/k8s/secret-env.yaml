# Secret for environment variables
# Secrets store sensitive data in base64-encoded format
#
# IMPORTANT: Base64 is NOT encryption! It's just encoding.
# - Never commit real secrets to Git
# - Use tools like Sealed Secrets, External Secrets Operator, or Vault in production
# - Use RBAC to restrict access to secrets
#
# Use Secrets for:
# - Passwords
# - API keys
# - OAuth tokens
# - TLS certificates
# - SSH keys

apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
  labels:
    app: config-demo
type: Opaque  # Generic secret type
data:
  # Values must be base64-encoded
  # To encode: echo -n "your-value" | base64
  # To decode: echo "encoded-value" | base64 -d
  
  # API_KEY = "sk-demo-1234567890abcdef"
  API_KEY: c2stZGVtby0xMjM0NTY3ODkwYWJjZGVm
  
  # DB_PASSWORD = "super-secret-password-123"
  DB_PASSWORD: c3VwZXItc2VjcmV0LXBhc3N3b3JkLTEyMw==

---
# You can also use stringData for automatic base64 encoding
# This is more readable but still shouldn't be committed to Git
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets-stringdata
  namespace: default
  labels:
    app: config-demo
type: Opaque
stringData:
  # Kubernetes will automatically base64-encode these values
  # This is convenient for development, but still don't commit real secrets!
  JWT_SECRET: "my-super-secret-jwt-key-change-in-production"
  OAUTH_CLIENT_SECRET: "oauth-client-secret-12345"

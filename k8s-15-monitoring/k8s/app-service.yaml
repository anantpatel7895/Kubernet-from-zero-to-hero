apiVersion: v1
kind: Service

metadata:
  name: metrics-app
  namespace: monitoring
  labels:
    app: metrics-app

spec:
  type: ClusterIP

  selector:
    app: metrics-app

  ports:
  - name: http
    port: 8000
    targetPort: http
---
# A NodePort so you can hit the app from your laptop and generate traffic.
# http://localhost:30080/work  /slow  /error  /flaky
apiVersion: v1
kind: Service

metadata:
  name: metrics-app-nodeport
  namespace: monitoring

spec:
  type: NodePort

  selector:
    app: metrics-app

  ports:
  - name: http
    port: 8000
    targetPort: http
    nodePort: 30080

apiVersion: v1
kind: Service

metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus

spec:
  type: ClusterIP

  selector:
    app: prometheus

  ports:
  - name: http
    port: 9090
    targetPort: http
---
# NodePort so you can open the Prometheus UI at http://localhost:30090
apiVersion: v1
kind: Service

metadata:
  name: prometheus-nodeport
  namespace: monitoring

spec:
  type: NodePort

  selector:
    app: prometheus

  ports:
  - name: http
    port: 9090
    targetPort: http
    nodePort: 30090

# node-exporter answers "how is the MACHINE doing?"
#   node_cpu_seconds_total, node_memory_*, node_filesystem_*, node_load1 ...
#
# It is a DaemonSet because you need exactly one copy per node, and it mounts
# the host's /proc and /sys read-only because that is where Linux keeps the
# numbers it exports.
apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter

spec:
  selector:
    matchLabels:
      app: node-exporter

  template:
    metadata:
      labels:
        app: node-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"

    spec:
      # Share the host's network and PID namespace so the exporter sees
      # real host interfaces and processes, not the Pod's.
      hostNetwork: true
      hostPID: true

      # Run on control-plane nodes too - they are the ones you most want
      # to know about when they run out of disk.
      tolerations:
      - operator: Exists

      containers:
      - name: node-exporter
        image: prom/node-exporter:v1.8.2

        args:
        - --path.procfs=/host/proc
        - --path.sysfs=/host/sys
        - --path.rootfs=/host/root
        # Ignore pseudo filesystems, otherwise node_filesystem_* is noise.
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)

        ports:
        - name: metrics
          containerPort: 9100

        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"

        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        - name: root
          mountPath: /host/root
          mountPropagation: HostToContainer
          readOnly: true

      volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      - name: root
        hostPath:
          path: /
---
apiVersion: v1
kind: Service

metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter

spec:
  type: ClusterIP
  clusterIP: None        # headless - one DNS record per pod
  selector:
    app: node-exporter
  ports:
  - name: metrics
    port: 9100
    targetPort: metrics

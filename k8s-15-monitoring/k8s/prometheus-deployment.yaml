apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus

spec:
  replicas: 1          # Prometheus is NOT horizontally scalable by replicas.
                       # Two replicas = two independent copies of the data.
                       # To scale you shard by scrape job, or use Thanos/Mimir.

  strategy:
    type: Recreate     # the TSDB directory can only be opened by one process

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus
      # Deliberately NOT annotated with prometheus.io/scrape.
      # The `prometheus` job in prometheus-config.yaml already scrapes
      # localhost:9090. Annotating as well would scrape this Pod twice
      # under two different job names - double the series, for nothing.

    spec:
      serviceAccountName: prometheus    # without this, discovery returns nothing

      securityContext:
        fsGroup: 65534                  # nobody - owns the TSDB volume
        runAsUser: 65534
        runAsNonRoot: true

      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.1

        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        # Retention: Prometheus deletes blocks older than this. It is a
        # LOCAL, single-node TSDB - for long-term storage you ship to
        # Thanos / Mimir / Cortex instead of raising this number forever.
        - --storage.tsdb.retention.time=24h
        - --web.enable-lifecycle          # allows POST /-/reload to pick up config
        - --web.console.libraries=/usr/share/prometheus/console_libraries
        - --web.console.templates=/usr/share/prometheus/consoles

        ports:
        - name: http
          containerPort: 9090

        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"

        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15

        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: rules
          mountPath: /etc/prometheus/rules
        - name: storage
          mountPath: /prometheus

      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: rules
        configMap:
          name: prometheus-rules
      # emptyDir keeps this lab simple: delete the Pod and the metrics are gone.
      # In production this is a PersistentVolumeClaim - see docs/13.
      - name: storage
        emptyDir: {}

# Load generator pod - hammers the service to trigger HPA scaling
# Uses 20 parallel workers to generate enough load to push CPU > 50%
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  labels:
    app: load-generator
    project: k8s-05
spec:
  restartPolicy: Never
  containers:
  - name: load-generator
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      echo "🔥 Starting AGGRESSIVE load generation with 20 parallel workers..."
      echo "Sending requests to scaling-service..."
      # Start 20 parallel worker loops to really push CPU
      for i in $(seq 1 20); do
        (while true; do
          wget -q -O- http://scaling-service:8000/ > /dev/null 2>&1
        done) &
      done
      wait
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "128Mi"

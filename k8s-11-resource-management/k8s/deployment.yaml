apiVersion: apps/v1
kind: Deployment

metadata:
  name: loadtest

spec:
  replicas: 1

  selector:
    matchLabels:
      app: loadtest

  template:
    metadata:
      labels:
        app: loadtest

    spec:
      containers:
      - name: loadtest

        image: loadtest:v1

        ports:
        - containerPort: 8000

        # Requests  = what the scheduler reserves for this container.
        # Limits    = the hard ceiling. Exceed memory -> OOMKilled.
        #             Exceed CPU -> throttled (never killed).
        #
        # CPU units:  1 = 1 core = 1000m.  100m = 0.1 core.
        # Overcommit: requests < limits, so the sum of limits on a node may
        #             exceed node capacity. Pods "burst" into spare capacity
        #             until the node is full.
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
            ephemeral-storage: "256Mi"   # disk for logs / scratch / emptyDir
          limits:
            cpu: "250m"
            memory: "256Mi"
            ephemeral-storage: "512Mi"   # exceed -> Pod evicted (not OOMKilled)

        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 30
          periodSeconds: 5

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15

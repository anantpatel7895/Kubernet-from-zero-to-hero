apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: loadtest-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loadtest

  minReplicas: 1
  maxReplicas: 10

  metrics:
  - type: Resource

    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: 70